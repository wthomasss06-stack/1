<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient définition -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF1B2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B00D3;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Cercle de fond -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Éclair stylisé (symbole électronique) -->
  <g filter="url(#glow)">
    <path d="M 120 40 L 70 100 L 95 100 L 80 160 L 130 100 L 105 100 Z" 
          fill="url(#logoGradient)" 
          stroke="#fff" 
          stroke-width="2"/>
  </g>
  
  <!-- Circuit électronique décoratif -->
  <g opacity="0.6">
    <!-- Lignes de circuit -->
    <line x1="50" y1="80" x2="70" y2="80" stroke="url(#logoGradient)" stroke-width="3"/>
    <circle cx="50" cy="80" r="4" fill="url(#logoGradient)"/>
    
    <line x1="130" y1="120" x2="150" y2="120" stroke="url(#logoGradient)" stroke-width="3"/>
    <circle cx="150" cy="120" r="4" fill="url(#logoGradient)"/>
    
    <line x1="60" y1="140" x2="80" y2="140" stroke="url(#logoGradient)" stroke-width="3"/>
    <circle cx="60" cy="140" r="4" fill="url(#logoGradient)"/>
    
    <line x1="120" y1="60" x2="140" y2="60" stroke="url(#logoGradient)" stroke-width="3"/>
    <circle cx="140" cy="60" r="4" fill="url(#logoGradient)"/>
  </g>
</svg>